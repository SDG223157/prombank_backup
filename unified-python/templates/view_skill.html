{% extends "base.html" %}

{% block content %}
<div class="px-4 py-6 sm:px-0" x-data="viewSkillData()" x-init="loadSkill()">
    <!-- Loading State -->
    <div x-show="loading" class="text-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-500 mx-auto"></div>
        <p class="mt-4 text-gray-600">Loading skill...</p>
    </div>
    
    <!-- Error State -->
    <div x-show="error && !loading" class="text-center py-12">
        <div class="text-red-500 text-6xl mb-4">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <h3 class="text-xl font-medium text-gray-900 mb-2">Error Loading Skill</h3>
        <p class="text-gray-600 mb-6" x-text="error"></p>
        <a href="/skills" class="bg-cyan-500 text-white px-6 py-3 rounded-lg hover:bg-cyan-600 transition">
            Back to Skills
        </a>
    </div>
    
    <!-- Skill Content -->
    <div x-show="!loading && !error && skill">
        <!-- Header -->
        <div class="mb-8">
            <a href="/skills" class="text-cyan-600 hover:text-cyan-700 mb-4 inline-block">
                <i class="fas fa-arrow-left mr-2"></i>Back to Skills
            </a>
            
            <div class="flex items-start justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 flex items-center">
                        <i class="fas fa-tools text-cyan-600 mr-3"></i>
                        <span x-text="skill.title"></span>
                    </h1>
                    <div class="flex items-center space-x-4 mt-2">
                        <span x-show="skill.category" class="bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full text-sm">
                            <i class="fas fa-folder mr-1"></i>
                            <span x-text="skill.category"></span>
                        </span>
                        <span x-show="skill.is_public" class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
                            <i class="fas fa-globe mr-1"></i>Public
                        </span>
                        <span x-show="!skill.is_public" class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-sm">
                            <i class="fas fa-lock mr-1"></i>Private
                        </span>
                        <span class="text-sm text-gray-500">
                            <i class="fas fa-file-code mr-1"></i>
                            <span x-text="(skill.files?.length || 0) + 1"></span> file<span x-text="(skill.files?.length || 0) + 1 !== 1 ? 's' : ''"></span>
                        </span>
                    </div>
                </div>
                
                <div class="flex space-x-3">
                    <button @click="copySkill()" 
                            class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition">
                        <i class="fas fa-copy mr-2"></i>Copy
                    </button>
                    <a :href="`/skills/${skill.id}/edit`" 
                       class="px-4 py-2 bg-cyan-500 text-white rounded-lg hover:bg-cyan-600 transition">
                        <i class="fas fa-edit mr-2"></i>Edit
                    </a>
                    <button @click="deleteSkill()" 
                            class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
                        <i class="fas fa-trash mr-2"></i>Delete
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Description -->
        <div x-show="skill.description" class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-3">
                <i class="fas fa-info-circle text-cyan-500 mr-2"></i>Description
            </h2>
            <p class="text-gray-700" x-text="skill.description"></p>
        </div>
        
        <!-- Tags -->
        <div x-show="skill.tags && skill.tags.length > 0" class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-3">
                <i class="fas fa-tags text-cyan-500 mr-2"></i>Tags
            </h2>
            <div class="flex flex-wrap gap-2">
                <template x-for="tag in skill.tags" :key="tag">
                    <span class="bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full text-sm" x-text="tag"></span>
                </template>
            </div>
        </div>
        
        <!-- File Tabs -->
        <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
            <div class="border-b border-gray-200">
                <nav class="flex -mb-px overflow-x-auto">
                    <button @click="activeTab = 'skill'"
                            :class="activeTab === 'skill' ? 'border-cyan-500 text-cyan-600 bg-cyan-50' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                            class="flex items-center px-6 py-4 border-b-2 font-medium text-sm transition whitespace-nowrap">
                        <i class="fas fa-file-code mr-2"></i>SKILL.md
                    </button>
                    <template x-for="(file, index) in skill.files" :key="index">
                        <button @click="activeTab = 'file-' + index"
                                :class="activeTab === 'file-' + index ? 'border-cyan-500 text-cyan-600 bg-cyan-50' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                                class="flex items-center px-6 py-4 border-b-2 font-medium text-sm transition whitespace-nowrap">
                            <i class="fas fa-file-alt mr-2"></i>
                            <span x-text="file.filename"></span>
                        </button>
                    </template>
                </nav>
            </div>
            
            <!-- SKILL.md Content -->
            <div x-show="activeTab === 'skill'" class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">SKILL.md</h3>
                    <button @click="copyContent(skill.content)" 
                            class="px-3 py-1 text-sm bg-gray-100 text-gray-600 rounded hover:bg-gray-200 transition">
                        <i class="fas fa-copy mr-1"></i>Copy
                    </button>
                </div>
                <div class="bg-gray-50 rounded-lg p-4 overflow-auto max-h-[600px]">
                    <div class="prose max-w-none" x-html="renderMarkdown(skill.content)"></div>
                </div>
                <div class="mt-4 border-t pt-4">
                    <h4 class="text-sm font-medium text-gray-700 mb-2">Raw Content</h4>
                    <pre class="bg-gray-900 text-gray-100 p-4 rounded-lg overflow-auto max-h-[400px] text-sm"><code x-text="skill.content"></code></pre>
                </div>
            </div>
            
            <!-- Additional File Content -->
            <template x-for="(file, index) in skill.files" :key="index">
                <div x-show="activeTab === 'file-' + index" class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-gray-900" x-text="file.filename"></h3>
                        <button @click="copyContent(file.content)" 
                                class="px-3 py-1 text-sm bg-gray-100 text-gray-600 rounded hover:bg-gray-200 transition">
                            <i class="fas fa-copy mr-1"></i>Copy
                        </button>
                    </div>
                    <template x-if="file.filename.endsWith('.md')">
                        <div>
                            <div class="bg-gray-50 rounded-lg p-4 overflow-auto max-h-[600px]">
                                <div class="prose max-w-none" x-html="renderMarkdown(file.content)"></div>
                            </div>
                            <div class="mt-4 border-t pt-4">
                                <h4 class="text-sm font-medium text-gray-700 mb-2">Raw Content</h4>
                                <pre class="bg-gray-900 text-gray-100 p-4 rounded-lg overflow-auto max-h-[400px] text-sm"><code x-text="file.content"></code></pre>
                            </div>
                        </div>
                    </template>
                    <template x-if="!file.filename.endsWith('.md')">
                        <pre class="bg-gray-900 text-gray-100 p-4 rounded-lg overflow-auto max-h-[600px] text-sm"><code x-text="file.content"></code></pre>
                    </template>
                </div>
            </template>
        </div>
        
        <!-- Metadata -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">
                <i class="fas fa-clock text-cyan-500 mr-2"></i>Metadata
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                <div>
                    <div class="text-gray-500">Created</div>
                    <div class="font-medium text-gray-900" x-text="formatDate(skill.created_at)"></div>
                </div>
                <div>
                    <div class="text-gray-500">Updated</div>
                    <div class="font-medium text-gray-900" x-text="formatDate(skill.updated_at)"></div>
                </div>
                <div>
                    <div class="text-gray-500">Files</div>
                    <div class="font-medium text-gray-900" x-text="(skill.files?.length || 0) + 1"></div>
                </div>
                <div>
                    <div class="text-gray-500">Visibility</div>
                    <div class="font-medium text-gray-900" x-text="skill.is_public ? 'Public' : 'Private'"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Include marked.js for markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
function viewSkillData() {
    return {
        skill: null,
        loading: true,
        error: null,
        activeTab: 'skill',
        skillId: '{{ skill_id }}',
        
        async loadSkill() {
            this.loading = true;
            this.error = null;
            
            try {
                const response = await fetch(`/api/skills/${this.skillId}`, {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/api/auth/google';
                        return;
                    }
                    if (response.status === 404) {
                        throw new Error('Skill not found');
                    }
                    throw new Error('Failed to load skill');
                }
                
                this.skill = await response.json();
                
            } catch (error) {
                console.error('Error loading skill:', error);
                this.error = error.message;
            } finally {
                this.loading = false;
            }
        },
        
        renderMarkdown(content) {
            if (!content) return '';
            try {
                return marked.parse(content);
            } catch (e) {
                return content;
            }
        },
        
        async copyContent(content) {
            try {
                await navigator.clipboard.writeText(content);
                alert('Copied to clipboard!');
            } catch (e) {
                console.error('Failed to copy:', e);
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = content;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Copied to clipboard!');
            }
        },
        
        async copySkill() {
            // Copy all skill content as a combined document
            let fullContent = `# ${this.skill.title}\n\n`;
            if (this.skill.description) {
                fullContent += `${this.skill.description}\n\n`;
            }
            fullContent += `---\n\n## SKILL.md\n\n${this.skill.content}\n`;
            
            if (this.skill.files && this.skill.files.length > 0) {
                for (const file of this.skill.files) {
                    fullContent += `\n---\n\n## ${file.filename}\n\n${file.content}\n`;
                }
            }
            
            await this.copyContent(fullContent);
        },
        
        async deleteSkill() {
            if (!confirm('Are you sure you want to delete this skill? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/skills/${this.skillId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to delete skill');
                }
                
                window.location.href = '/skills';
                
            } catch (error) {
                console.error('Error deleting skill:', error);
                alert('Failed to delete skill: ' + error.message);
            }
        },
        
        formatDate(dateString) {
            if (!dateString) return 'N/A';
            return new Date(dateString).toLocaleString();
        }
    };
}
</script>
{% endblock %}
