version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.unified-python
    container_name: prompthouse-unified-python
    env_file: .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
